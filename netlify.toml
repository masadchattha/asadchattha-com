# ONE Netlify project serves every version of the site.
#
# `publish` is resolved relative to `base`, so this maps to main/dist.
# The `prebuild` step in main/package.json copies archives/v1, /v2, /v3 into
# main/public first, so they land in dist as /v1, /v2, /v3.
[build]
  base = "main"
  command = "npm run build"
  publish = "dist"
  # Because `base` is main/, Netlify's own check only looks inside main/ — and
  # every archived version lives in archives/, copied in at build time. Commits
  # touching archives/ alone were cancelled as "no content change" and never
  # went live.
  #
  # This was briefly `exit 1` (always build). That fixed the miss but each
  # production deploy costs an account credit, and combined with small,
  # frequent commits it burned through the monthly allowance. Commits are free;
  # DEPLOYS are the metered thing. So: build when something publishable
  # changed, skip when it did not.
  #
  # Semantics are inverted: exit 0 means SKIP, non-zero means BUILD. git diff
  # --quiet exits 0 when there is no difference in those paths.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- main archives netlify.toml"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Version subdomains.
#
# Each vN.asadchattha.com is a domain alias on THIS site, rewritten (status 200,
# not a 301) onto the matching folder — so the address bar keeps saying
# v1.asadchattha.com while the content comes from /v1. `force = true` is needed
# because the root site already answers for those paths.
#
# Adding a version later is three steps: drop it in archives/, add a CNAME in
# Spaceship pointing at asadchattha.netlify.app, and copy a block below.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "https://v1.asadchattha.com/*"
  to = "/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://v2.asadchattha.com/*"
  to = "/v2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://v3.asadchattha.com/*"
  to = "/v3/:splat"
  status = 200
  force = true
